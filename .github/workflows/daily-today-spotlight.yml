name: Daily today spotlight

on:
  schedule:
    # Every day 13:00 UTC (~9:00 AST)
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post today's top 3 to Facebook + Instagram
        env:
          SITE_URL: https://pop-event.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret not set — add it in repo Settings → Secrets."
            exit 1
          fi
          tmp="$(mktemp)"
          http=$(curl -sS --max-time 90 -o "$tmp" -w "%{http_code}" \
            -X POST "${SITE_URL}/api/cron/meta-post" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"source":"today","locale":"en"}')
          echo "HTTP ${http}"
          cat "$tmp"
          echo
          if [ "$http" = "422" ]; then
            echo "No today events to spotlight — skipping."
            exit 0
          fi
          if [ "$http" -ge 200 ] && [ "$http" -lt 300 ]; then
            if grep -Eq '"success"[[:space:]]*:[[:space:]]*true' "$tmp"; then
              exit 0
            fi
          fi
          echo "Today spotlight publish failed."
          exit 1
