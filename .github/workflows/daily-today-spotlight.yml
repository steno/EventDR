name: Daily today spotlight

on:
  # Manual only — no cron. Run from Actions → workflow_dispatch, or
  # `node scripts/run-today-spotlight.mjs` / ask the agent to spotlight.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (test without posting to social media)'
        required: false
        type: boolean
        default: false
      instagram_only:
        description: 'Instagram only (skip Facebook album)'
        required: false
        type: boolean
        default: false
      facebook_only:
        description: 'Facebook only (skip Instagram image posts)'
        required: false
        type: boolean
        default: false
      exclude_event_ids:
        description: 'Comma-separated event ids to skip on this run'
        required: false
        type: string
        default: ''

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check Meta configuration
        env:
          SITE_URL: https://pop-event.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "::group::Checking Meta API configuration"
          config_check="$(mktemp)"
          # Env-only check — do not call Graph here (inspect=1 burns rate-limit quota).
          config_http=$(curl -sS --max-time 30 -o "$config_check" -w "%{http_code}" \
            -X GET "${SITE_URL}/api/cron/meta-post" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          
          if [ "$config_http" = "200" ]; then
            echo "✓ Meta configuration is valid"
            cat "$config_check"
            echo
          elif [ "$config_http" = "429" ]; then
            echo "::error::Meta Graph is rate-limited. Skip posting and wait ~15 minutes."
            cat "$config_check"
            echo
            exit 1
          else
            echo "::warning::Meta configuration check returned HTTP ${config_http}"
            cat "$config_check"
            echo
          fi
          echo "::endgroup::"
      
      - name: Publish today’s spotlight to Facebook and Instagram
        env:
          SITE_URL: https://pop-event.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
          # Default: both networks. Optional single-network overrides via inputs.
          INSTAGRAM_ONLY: ${{ github.event.inputs.instagram_only == 'true' && 'true' || 'false' }}
          FACEBOOK_ONLY: ${{ github.event.inputs.facebook_only == 'true' && 'true' || 'false' }}
          TODAY_SPECIALS: "false"
          EXCLUDE_EVENT_IDS: ${{ github.event.inputs.exclude_event_ids }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret not set — add it in repo Settings → Secrets."
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Running in DRY RUN mode - no posts will be published"
          elif [ "$INSTAGRAM_ONLY" = "true" ]; then
            echo "::notice::Publishing Instagram image posts only (specials first, then happening today)"
          elif [ "$FACEBOOK_ONLY" = "true" ]; then
            echo "::notice::Publishing Facebook album only (specials first, then happening today)"
          else
            echo "::notice::Publishing Facebook album + Instagram image posts (specials first, then happening today)"
          fi
          node scripts/run-today-spotlight.mjs
