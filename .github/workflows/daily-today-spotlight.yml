name: Daily today spotlight

on:
  schedule:
    # Every day 13:00 UTC (~9:00 AST)
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (test without posting to social media)'
        required: false
        type: boolean
        default: false
      instagram_only:
        description: 'Post to Instagram only (skip Facebook)'
        required: false
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check Meta configuration
        env:
          SITE_URL: https://pop-event.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "::group::Checking Meta API configuration"
          config_check="$(mktemp)"
          # Env-only check — do not call Graph here (inspect=1 burns rate-limit quota).
          config_http=$(curl -sS --max-time 30 -o "$config_check" -w "%{http_code}" \
            -X GET "${SITE_URL}/api/cron/meta-post" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          
          if [ "$config_http" = "200" ]; then
            echo "✓ Meta configuration is valid"
            cat "$config_check"
            echo
          elif [ "$config_http" = "429" ]; then
            echo "::error::Meta Graph is rate-limited. Skip posting and wait ~15 minutes."
            cat "$config_check"
            echo
            exit 1
          else
            echo "::warning::Meta configuration check returned HTTP ${config_http}"
            cat "$config_check"
            echo
          fi
          echo "::endgroup::"
      
      - name: Post today's top 3 to Facebook + Instagram
        env:
          SITE_URL: https://pop-event.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
          INSTAGRAM_ONLY: ${{ github.event.inputs.instagram_only == 'true' && 'true' || 'false' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret not set — add it in repo Settings → Secrets."
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Running in DRY RUN mode - no posts will be published"
          elif [ "$INSTAGRAM_ONLY" = "true" ]; then
            echo "::notice::Posting to Instagram only — skipping Facebook"
          fi
          node scripts/run-today-spotlight.mjs
