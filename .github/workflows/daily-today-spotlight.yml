name: Daily today spotlight

on:
  schedule:
    # Every day 08:00 UTC (~4:00 AST). Prefers all of today’s specials when that
    # channel has not posted yet (up to 10); never uses TODAY_SPECIALS=true itself.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (test without posting to social media)'
        required: false
        type: boolean
        default: false
      instagram_only:
        description: '(Unused — job always posts Instagram Reels only)'
        required: false
        type: boolean
        default: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (still → Reel MP4)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check Meta configuration
        env:
          SITE_URL: https://pop-event.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "::group::Checking Meta API configuration"
          config_check="$(mktemp)"
          # Env-only check — do not call Graph here (inspect=1 burns rate-limit quota).
          config_http=$(curl -sS --max-time 30 -o "$config_check" -w "%{http_code}" \
            -X GET "${SITE_URL}/api/cron/meta-post" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          
          if [ "$config_http" = "200" ]; then
            echo "✓ Meta configuration is valid"
            cat "$config_check"
            echo
          elif [ "$config_http" = "429" ]; then
            echo "::error::Meta Graph is rate-limited. Skip posting and wait ~15 minutes."
            cat "$config_check"
            echo
            exit 1
          else
            echo "::warning::Meta configuration check returned HTTP ${config_http}"
            cat "$config_check"
            echo
          fi
          echo "::endgroup::"
      
      - name: Publish today’s events as individual Instagram Reels
        env:
          SITE_URL: https://pop-event.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
          # Reels only — no Facebook album / IG feed posts.
          INSTAGRAM_ONLY: "true"
          TODAY_SPECIALS: "false"
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret not set — add it in repo Settings → Secrets."
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Running in DRY RUN mode - no Reels will be published"
          else
            echo "::notice::Publishing individual Instagram Reels (no feed posts, no Facebook)"
          fi
          node scripts/run-today-spotlight.mjs
